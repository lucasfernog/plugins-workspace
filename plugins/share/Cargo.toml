[package]
name = "tauri-plugin-share"
version = "2.0.0"
description = "Share text, links and files through the system share sheet"
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
links = "tauri-plugin-share"
exclude = ["/guest-js", "/package.json", "/rollup.config.js", "/tsconfig.json"]

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs"]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "x86_64-linux-android",
]

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "none", notes = "There is no system share sheet" }
macos = { level = "full", notes = "" }
android = { level = "full", notes = "" }
ios = { level = "full", notes = "" }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }
schemars = { workspace = true }
serde = { workspace = true }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
thiserror = { workspace = true }

[target."cfg(windows)".dependencies]
windows-collections = "0.3"

[target."cfg(windows)".dependencies.windows]
version = "0.62"
features = [
  "ApplicationModel_DataTransfer",
  "Foundation",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_UI_Shell",
]

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"

[target."cfg(target_os = \"macos\")".dependencies.objc2-app-kit]
version = "0.3"
default-features = false
features = ["std", "NSResponder", "NSSharingService", "NSView"]

[target."cfg(target_os = \"macos\")".dependencies.objc2-foundation]
version = "0.3"
default-features = false
features = [
  "std",
  "objc2-core-foundation",
  "NSArray",
  "NSGeometry",
  "NSString",
  "NSURL",
]

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { workspace = true, features = ["wry"] }
