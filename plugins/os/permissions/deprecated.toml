"$schema" = "schemas/schema.json"

# These commands do not exist: the values they would return are injected into
# every webview by the plugin's initialization script. The permissions are kept
# so existing capability files keep working, and will be removed in v3.

[[permission]]
identifier = "allow-platform"
description = "Enables the platform command without any pre-configured scope. (**DEPRECATED**: this permission has no effect, `platform()` reads a value injected into every webview at startup and is always available. It will be removed in v3)"
commands.allow = ["platform"]

[[permission]]
identifier = "deny-platform"
description = "Denies the platform command without any pre-configured scope. (**DEPRECATED**: this permission has no effect, `platform()` reads a value injected into every webview at startup and is always available. It will be removed in v3)"
commands.deny = ["platform"]

