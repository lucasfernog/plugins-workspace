[package]
name = "tauri-plugin-secure-storage"
description = "Store secrets in the operating system's secure storage."
version = "1.0.0"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
links = "tauri-plugin-secure-storage"
exclude = ["/guest-js", "/package.json", "/rollup.config.js", "/tsconfig.json"]

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-linux-android"]

[package.metadata.platforms.support]
windows = { level = "full", notes = "Credential Manager; values are limited to 2560 bytes" }
linux = { level = "full", notes = "Requires a Secret Service provider such as GNOME Keyring or KWallet" }
macos = { level = "full", notes = "Keychain" }
android = { level = "full", notes = "Android Keystore" }
ios = { level = "full", notes = "Keychain" }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
serde = { workspace = true }
tauri = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dev-dependencies]
keyring-core = { version = "1", features = ["sample"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = [
  "crypto-rust",
] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { workspace = true, features = ["wry"] }
